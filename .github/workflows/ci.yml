# GitHub Actions: jednoduchá pipeline pro test backendu a frontendu.
# Běží v každém pull requestu a na každém pushi do hlavní větve.
# Bez externích služeb: integrační test proti Postgresu se sám přeskočí (Assumptions),
# LLM a Ollama se v testech nevolají (mock).

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test
        working-directory: backend
        run: mvn -B -q --no-transfer-progress test
      - name: JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit
          path: backend/target/surefire-reports/TEST-*.xml
          if-no-files-found: ignore

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --prefer-offline
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  # Ověří, že se oba Docker image postaví (stejné Dockerfile jako v docker-compose).
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t caselaw-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t caselaw-frontend:ci ./frontend
